---
name: CodeRabbit
on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number

jobs:
  trigger-coderabbit:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.actor == 'submariner-bot'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = ${{ inputs.pr_number }};

            const triggerComment = '@coderabbitai review';
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: triggerComment
            });
            console.log('CodeRabbit review comment posted.');

            // Enable auto-merge
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number
            });

            try {
              await github.graphql(`
                mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: REBASE
                  }) {
                    pullRequest {
                      id
                    }
                  }
                }
              `, {
                pullRequestId: pr.data.node_id
              });
              console.log('Auto-merge enabled with rebase method.');
            } catch (error) {
              console.error('Failed to enable auto-merge:', error.message);
              throw error;
            }

            // Add ready-to-test label
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: ['ready-to-test']
              });
              console.log('Added ready-to-test label.');
            } catch (error) {
              console.log('Could not add ready-to-test label (label may not exist):', error.message);
            }
